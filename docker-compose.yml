# Docker Compose configuration for hn.fm development
# Includes hot reloading and auto-reload functionality

# Define reusable service configurations using anchors
x-common-app-config: &common-app-config
  build:
    context: .
    dockerfile: Dockerfile
  # .lan inference hosts resolve via the Mac's /etc/resolver/lan (loopback
  # dnsmasq), which containers can't reach — pin them to the cluster's traefik
  # ingress IP instead (any node IP works; traefik routes by Host header).
  # Pointed at .174 since 2026-09-01: .173 is down. Any live node works.
  extra_hosts:
    - "litellm.lan:192.168.5.174"
    - "firecrawl.lan:192.168.5.174"
    - "magpie.lan:192.168.5.174"
    - "flux.lan:192.168.5.174"
    - "ltx.lan:192.168.5.174"
    - "asr.lan:192.168.5.174"
    - "acestep.lan:192.168.5.174"
    - "dia.lan:192.168.5.174"
    - "studio-voice.lan:192.168.5.174"
    - "omni.lan:192.168.5.174"
  volumes:
    - ./src:/app/src  # Mount source code for hot reloading
    - ./outputs:/app/outputs
    - ./cache:/app/cache
    - ./voices:/app/voices  # Mount voice samples for TTS
    - ./htmlcov:/app/htmlcov  # Mount coverage reports for easy access
    - ./config.yaml:/app/config.yaml:ro
    # Mounted (not just baked in) so prompts can be edited against a running
    # worker; set PROMPTS_NO_CACHE=1 to pick up edits without a restart.
    - ./prompts:/app/prompts:ro
    # Same reasoning as prompts: a new migration should apply without a rebuild.
    - ./alembic:/app/alembic:ro
    - ./alembic.ini:/app/alembic.ini:ro
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    # Nothing that queries the DB starts until the schema is at head.
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  networks:
    - hnfm-network

# Define common environment variables
x-common-env: &common-env
  # Python and Debug
  PYTHONPATH: /app/src
  DEBUG: "true"
  LOG_LEVEL: DEBUG
  # Redis Configuration (Celery broker/result backend only)
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Postgres (application data store)
  DATABASE_URL: postgresql+psycopg://hnfm:hnfm@postgres:5432/hnfm
  # Off: the `migrate` service owns the schema. create_all cannot ALTER an
  # existing table, so leaving it on just hides drift until a query fails.
  HNFM_DB_AUTO_CREATE: "false"
  # MinIO object store (media artifacts). S3_PUBLIC_URL is what the browser
  # can reach (presigned URLs are signed against it); S3_ENDPOINT_URL is the
  # in-network address the app uses.
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9400}
  S3_BUCKET: ${S3_BUCKET:-hnfm-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hnfm}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-hnfm-minio-secret}
  MEDIA_UPLOAD_ENABLED: ${MEDIA_UPLOAD_ENABLED:-true}
  # API Keys
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # TTS Service Configuration
  TTS_BASE_URL: ${TTS_BASE_URL:-http://localhost:7860}
  TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-notebooklm}
  TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-120}
  # Studio Voice Configuration
  STUDIO_VOICE_TARGET: ${STUDIO_VOICE_TARGET:-localhost:8001}
  STUDIO_VOICE_MODEL_TYPE: ${STUDIO_VOICE_MODEL_TYPE:-48k-hq}
  STUDIO_VOICE_HTTP_HEALTH_URL: ${STUDIO_VOICE_HTTP_HEALTH_URL:-http://localhost:8001/health}
  # ASR Service Configuration
  ASR_BASE_URL: ${ASR_BASE_URL:-http://localhost:8042}
  ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-large-v2}
  ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-300}
  ASR_MAX_ATTEMPTS: ${ASR_MAX_ATTEMPTS:-1}
  ASR_ENABLED: ${ASR_ENABLED:-true}
  # ACE-Step music
  ACESTEP_BASE_URL: ${ACESTEP_BASE_URL:-http://host.docker.internal:8015}
  MUSIC_ENABLED: ${MUSIC_ENABLED:-false}
  # LTX-2 video clips
  LTX_BASE_URL: ${LTX_BASE_URL:-http://host.docker.internal:8023}
  VIDEO_ENABLED: ${VIDEO_ENABLED:-false}
  VIDEO_CLIPS_PER_SEGMENT: ${VIDEO_CLIPS_PER_SEGMENT:-2}
  LTX_MAX_NATIVE_SECONDS: ${LTX_MAX_NATIVE_SECONDS:-3.5}
  LTX_MAX_STRETCH: ${LTX_MAX_STRETCH:-1.4}
  LTX_RETRIES: ${LTX_RETRIES:-2}
  LTX_INTERP_MODE: ${LTX_INTERP_MODE:-blend}
  # HyperFrames render sidecar
  HYPERFRAMES_BASE_URL: ${HYPERFRAMES_BASE_URL:-http://hyperframes:8088}
  HYPERFRAMES_ENABLED: ${HYPERFRAMES_ENABLED:-false}
  HF_MAX_SECONDS: ${HF_MAX_SECONDS:-5}
  # Agentic meta-sequencer (per-section template director)
  META_SEQUENCER_ENABLED: ${META_SEQUENCER_ENABLED:-false}
  META_MAX_VIDEO: ${META_MAX_VIDEO:-2}
  META_MAX_HYPER: ${META_MAX_HYPER:-2}
  # TTS backend selection + Magpie voices
  TTS_BACKEND: ${TTS_BACKEND:-magpie}
  MAGPIE_S1_VOICE: ${MAGPIE_S1_VOICE:-Magpie-Multilingual.EN-US.Mia}
  MAGPIE_S2_VOICE: ${MAGPIE_S2_VOICE:-Magpie-Multilingual.EN-US.Jason}
  STUDIO_VOICE_ENABLED: ${STUDIO_VOICE_ENABLED:-false}
  # Outputs (set both to avoid OUTPUTS_DIR/OUTPUTS_ROOT split)
  OUTPUTS_DIR: ${OUTPUTS_DIR:-/app/outputs}
  OUTPUTS_ROOT: ${OUTPUTS_ROOT:-/app/outputs}
  # Local LLM Configuration
  LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:1234/v1}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  # Firecrawl Configuration
  FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-http://localhost:3002}
  # Source images (real images from the scraped article)
  SOURCE_IMAGES_ENABLED: ${SOURCE_IMAGES_ENABLED:-false}
  SOURCE_IMAGES_TOP_N: ${SOURCE_IMAGES_TOP_N:-4}
  # Kindle digest delivery. Empty by default — the digest still renders and is
  # viewable in the browser without any of these; only emailing needs them.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAILJET_API_KEY: ${MAILJET_API_KEY:-}
  MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  DIGEST_FROM_EMAIL: ${DIGEST_FROM_EMAIL:-}
  KINDLE_EMAIL: ${KINDLE_EMAIL:-}
  DIGEST_STORY_COUNT: ${DIGEST_STORY_COUNT:-5}
  DIGEST_FORMAT: ${DIGEST_FORMAT:-html}
  DIGEST_SCHEDULE_ENABLED: ${DIGEST_SCHEDULE_ENABLED:-false}
  DIGEST_SCHEDULE_HOUR: ${DIGEST_SCHEDULE_HOUR:-10}
  DIGEST_SCHEDULE_MINUTE: ${DIGEST_SCHEDULE_MINUTE:-0}
  # Hacker News Configuration
  HN_USER_AGENT: ${HN_USER_AGENT:-hn.fm/0.1.0 (briancaffey)}
  # Content Configuration
  MAX_EPISODE_LENGTH: ${MAX_EPISODE_LENGTH:-15}
  INCLUDE_COMMENTS: ${INCLUDE_COMMENTS:-true}
  QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.8}
  # Image Generation Configuration
  IMAGE_GENERATION_BACKEND: ${IMAGE_GENERATION_BACKEND:-NIM}
  IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-http://localhost:8000}
  # InvokeAI Configuration
  INVOKEAI_BASE_URL: ${INVOKEAI_BASE_URL:-http://localhost:9090}
  INVOKEAI_BOARD_ID: ${INVOKEAI_BOARD_ID:-}

services:
  # Postgres — application data store (items, runs, segments, metrics)
  postgres:
    image: postgres:17-alpine
    container_name: hnfm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hnfm
      POSTGRES_PASSWORD: hnfm
      POSTGRES_DB: hnfm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnfm -d hnfm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hnfm-network

  # MinIO — S3-compatible object store for generated media (audio/images/video).
  # Host ports 9400 (API) / 9401 (console) because 9000/9090/9100 are taken by
  # cluster tunnels and other local services.
  minio:
    image: minio/minio:latest
    container_name: hnfm-minio
    ports:
      - "9400:9000"
      - "9401:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hnfm}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hnfm-minio-secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hnfm-network

  # Redis service for Celery broker and result backend
  redis:
    image: redis:7-alpine
    container_name: hnfm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hnfm-network

  # RedisInsight for Redis monitoring and management
  redisinsight:
    image: redis/redisinsight:latest
    container_name: hnfm-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - hnfm-network

  # Schema migrations. Runs to completion before web/worker/beat/jupyter
  # start, so a fresh checkout and an existing volume both converge on head
  # with no manual step. One-shot: `restart: "no"` overrides the shared
  # `unless-stopped`, and depends_on is narrowed to postgres so it does not
  # inherit the anchor's dependency on itself.
  migrate:
    <<: *common-app-config
    container_name: hnfm-migrate
    environment:
      <<: *common-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # FastAPI web server with hot reloading
  web:
    <<: *common-app-config
    container_name: hnfm-web
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      WEB_RELOAD: "true"
    command: ["python", "src/hnfm/scripts/run_web_server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery workers, one per cost class (see celery_app.task_routes).
  #
  # A single queue meant a 4-second scrape sat behind a 3-hour full_pipeline.
  # These lanes let cheap network-bound work proceed while a render holds the
  # GPU. Only the render lane must stay serial.

  # Render: GPU and ffmpeg. Serial on purpose — concurrent renders contend for
  # the same devices and get slower, not faster. Also drains the legacy
  # hnfm_tasks queue so messages enqueued before the split are not stranded.
  celery-worker:
    <<: *common-app-config
    container_name: hnfm-celery-worker
    environment:
      <<: *common-env
      CELERY_ALWAYS_EAGER: "false"
      CELERY_WORKER_CONCURRENCY: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "1000"
      CELERY_TASK_SOFT_TIME_LIMIT: "300"
      CELERY_TASK_TIME_LIMIT: "600"
    command: ["celery", "-A", "src.hnfm.web.celery_app:celery_app", "worker", "--loglevel=info", "--hostname=render@%h", "--queues=hnfm_render,hnfm_tasks"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.hnfm.web.celery_app:celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ingest: scrape plus a few LLM calls, entirely I/O-bound. Concurrency is the
  # whole point of this lane — measured at ~40s/item strictly serially.
  celery-worker-ingest:
    <<: *common-app-config
    container_name: hnfm-celery-worker-ingest
    environment:
      <<: *common-env
      CELERY_ALWAYS_EAGER: "false"
      CELERY_WORKER_CONCURRENCY: "4"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "1000"
    command: ["celery", "-A", "src.hnfm.web.celery_app:celery_app", "worker", "--loglevel=info", "--hostname=ingest@%h", "--concurrency=4", "--queues=hnfm_ingest"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.hnfm.web.celery_app:celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Triage: LLM scoring and Story Briefs. Kept modest — these all hit the same
  # LM Studio instance, which serves one model.
  celery-worker-triage:
    <<: *common-app-config
    container_name: hnfm-celery-worker-triage
    environment:
      <<: *common-env
      CELERY_ALWAYS_EAGER: "false"
      CELERY_WORKER_CONCURRENCY: "2"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "1000"
    command: ["celery", "-A", "src.hnfm.web.celery_app:celery_app", "worker", "--loglevel=info", "--hostname=triage@%h", "--concurrency=2", "--queues=hnfm_triage"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.hnfm.web.celery_app:celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Digest: long, self-contained, and scheduled. Its own lane so the nightly
  # build never waits on a video and never delays one.
  celery-worker-digest:
    <<: *common-app-config
    container_name: hnfm-celery-worker-digest
    environment:
      <<: *common-env
      CELERY_ALWAYS_EAGER: "false"
      CELERY_WORKER_CONCURRENCY: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "1000"
    command: ["celery", "-A", "src.hnfm.web.celery_app:celery_app", "worker", "--loglevel=info", "--hostname=digest@%h", "--queues=hnfm_digest"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.hnfm.web.celery_app:celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat
  celery-beat:
    <<: *common-app-config
    container_name: hnfm-celery-beat
    environment:
      <<: *common-env
      PIDFILE: "/tmp/celerybeat.pid"
    command: ["celery", "-A", "src.hnfm.web.celery_app:celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD", "celery", "-A", "src.hnfm.web.celery_app:celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flower monitoring
  flower:
    image: mher/flower:2.0.1
    container_name: hnfm-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_PORT=5555
      - FLOWER_BROKER_API=redis://redis:6379/0
      - FLOWER_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BROKER_API_REDIS_HOST=redis
      - FLOWER_BROKER_API_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hnfm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # HyperFrames render sidecar (HTML -> MP4/WebM via headless Chrome)
  hyperframes:
    build:
      context: ./services/hyperframes
      dockerfile: Dockerfile
    image: hnfm-hyperframes:latest
    container_name: hnfm-hyperframes
    ports:
      - "8088:8088"
    volumes:
      - ./outputs:/app/outputs  # same path as the worker so absolute paths match
    restart: unless-stopped
    networks:
      - hnfm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8088/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Jupyter Lab for interactive development
  jupyter:
    <<: *common-app-config
    container_name: hnfm-jupyter
    ports:
      - "8888:8888"
    environment:
      <<: *common-env
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.password=''"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local

networks:
  hnfm-network:
    driver: bridge
