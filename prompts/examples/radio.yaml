sponsor:
  - material: |
      The product nobody sells: the undo button
    plan:
      hook: "Has this ever happened to you?"
      facts: ["you change one line and wish you had not", "undo was there the whole time"]
      ending: "Brought to you by nobody. But if it were, it would be Undo."
    lines:
      - {speaker: ray, mood: default, text: "Has this ever happened to you? You change one line. And you would like, very much, to not have changed it."}
      - {speaker: ray, mood: default, text: "Then you need Undo. One key. No subscription. Undo: it was there the whole time."}
      - {speaker: ray, mood: calm, text: "H.N.F.M. is brought to you by nobody. But if it were, it would be Undo."}

