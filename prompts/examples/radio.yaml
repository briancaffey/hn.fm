word:
  - material: |
      Term: bikeshedding
    plan:
      hook: "The word of the hour is bikeshedding."
      facts: ["a committee approves a reactor in minutes, argues an hour over the bike shed colour", "when a database meeting becomes a naming meeting"]
      ending: "a meeting about a variable name."
    lines:
