stack:
  - material: |
      - Nemotron writes every word. It runs on a small computer in the house.
      - Magpie voices every host.
      - ACE-Step makes the music.
    plan:
      hook: "Nobody is in this building."
      facts: ["Nemotron writes", "Magpie speaks", "ACE-Step plays"]
      ending: "It mostly works, which still surprises us."
    lines:
      - {speaker: ray, mood: default, text: "Nobody is in this building. A model called Nemotron wrote this sentence, on a small computer in somebody's house."}
      - {speaker: ray, mood: default, text: "A model called Magpie is saying it. And the music you are about to hear was made, a minute ago, by one called ACE-Step."}
      - {speaker: ray, mood: calm, text: "It mostly works. That still surprises us."}
