# hn.fm Pipeline Configuration

# Voice Configuration
voice:
  default: "notebooklm"
  available_voices:
    - "notebooklm"
    - "studio_voice"

# TTS Service Configuration
tts:
  base_url: "${TTS_BASE_URL}"
  default_voice: "${TTS_DEFAULT_VOICE}"
  batch_size: 3
  max_attempts: 3
  delay_between_batches: 1  # seconds

# Studio Voice Configuration (NVIDIA NIM)
studio_voice:
  enabled: true
  target: "${STUDIO_VOICE_TARGET}"
  model_type: "${STUDIO_VOICE_MODEL_TYPE}"
  http_health_url: "${STUDIO_VOICE_HTTP_HEALTH_URL}"
  streaming: false
  ssl_mode: null
  sample_rate: 48000

# LLM Configuration (LiteLLM gateway)
llm:
  enabled: true
  base_url: "${LLM_BASE_URL}"  # Primary endpoint
  model: "${LLM_MODEL}"
  provider: "local"

  # Model allowlist (plans/08). The gateway advertises 221 routes, including
  # groq and ~200 `lmstudio/*` entries mirroring the commercial OpenAI catalog
  # (gpt-5.x, o3-pro, sora-2). This project runs on FREE routes only, so calls
  # are checked against this list before the request AND against the model the
  # gateway reports serving — which is what catches silent server-side failover
  # (the `nemotron-omni` route has been seen falling back to groq).
  # Patterns are fnmatch; deny wins over allow. Set LLM_STRICT_MODEL=1 to make
  # an unexpected substitution fatal rather than a loud error.
  models:
    allow:
      - "nvidia-nemotron-super"
      - "openrouter-nemotron-ultra"
      - "nemotron-omni"
    deny:
      - "groq*"
      - "*/groq*"

  # Per-task profiles. One model at temperature 0.7 used to serve triage,
  # summaries, scripts, image prompts and the director alike; these want
  # different settings. Any model named here must be in the allowlist above.
  profiles:
    script.write:
      temperature: 0.8      # voice and surprise
      max_tokens: 4000      # a full structured script
    triage.score:
      temperature: 0.2      # judgement should be stable across re-runs
      max_tokens: 800
      fallback_model: "openrouter-nemotron-ultra"
    image.scene:
      temperature: 0.95     # scene variety is the whole point
      max_tokens: 300
    media_plan.plan:
      temperature: 0.7
      max_tokens: 2000
    media_plan.critic:
      temperature: 0.3
      max_tokens: 800
    sequence.plan:
      # The only multimodal call in the pipeline: it sends a rendered frame.
      # nvidia-nemotron-super is text-only and cloud-routed, and the gateway's
      # PII guard fail-closes on image payloads to it (500 "rampart PII guard
      # failed"), so this must be the omni route.
      # nemotron-omni has been observed failing over to groq when the local box
      # is down — llm.models now checks the served model on every response, so
      # that substitution surfaces instead of passing silently.
      model: "nemotron-omni"
      temperature: 0.85
      max_tokens: 500
    # The two halves of the Story Brief run at deliberately different
    # temperatures — that difference is the main reason they are separate
    # calls (see content/story_brief.py).
    brief.framing:
      temperature: 0.7      # finding the angle is a creative act
      max_tokens: 1500
    brief.evidence:
      temperature: 0.15     # extraction must be faithful, not imaginative
      max_tokens: 2500
    summary:
      temperature: 0.3
      max_tokens: 1000
    enrich:
      temperature: 0.6
      max_tokens: 500

# Show identity (plans/11). The script prompt used to invent a show name per
# story — "Proof Positive", "DevOps Digest", "Breaking Discoveries" — so no two
# videos belonged to the same channel. Data, not prompt text.
show:
  name: "hn.fm"
  tagline: "Hacker News, watchable."

# Story Triage Configuration (plans/04-story-scoring.md)
# The rubric is data, not code — tune it here without a deploy.
triage:
  # Free models via LiteLLM only (no groq, nothing paid). TRIAGE_LLM_MODEL
  # env var overrides. Primary NVIDIA-hosted; OpenRouter free nemotron fallback.
  model: "nvidia-nemotron-super"
  fallback_model: "openrouter-nemotron-ultra"
  # Weighted interest profile: topic keyword -> weight (matched against the
  # LLM-extracted topics; substring, case-insensitive). Negative = penalize.
  interest_profile:
    generative-ai: 3.0
    local-ai: 3.0
    llm: 2.5
    machine-learning: 2.0
    ai: 2.0
    gpu: 1.5
    self-hosted: 1.5
    robotics: 1.0
    hardware: 1.0
    programming: 0.5
    crypto: -2.0
  # Two-axis ranking (plans/09):
  #   base = w_interest*interest + w_interest_match*match*100
  #          + w_hn*log10(hn_score+1)*25
  #   rank = base * (producibility_floor + (1-floor)*producibility/100)
  # Producibility multiplies rather than adds: a story we cannot build should
  # sink regardless of how interesting it is, but never vanish (the floor) —
  # this is ordering, not censorship. Human feedback boosts apply at query time.
  weights:
    interest: 1.0
    interest_match: 0.6
    hn_score: 0.4
    producibility_floor: 0.15
  # "Worth it, needs a better source": high interest, low producibility. A
  # fix-the-scrape signal, surfaced as its own bucket rather than a reject.
  buckets:
    needs_source_min_interest: 65
    needs_source_max_producibility: 45
  rubric: |
    Favor stories that make ENGAGING videos: concrete stakes, human drama or
    surprise, broad comprehensibility, and things that can be SHOWN (demos,
    physical objects, visual metaphors, data). Penalize: obscure dependency
    changelogs, minor library releases, pure code minutiae, paywalled stubs
    with no substance, dry corporate announcements, listicles with no angle.
    A niche topic is fine if the story has tension or a striking visual hook.

# Content Processing Configuration
content:
  max_episode_length: 15
  include_comments: true
  quality_threshold: 0.8
  max_paragraphs: 10

# Pipeline Configuration
pipeline:
  # Steps that can be skipped (using cached data)
  skippable_steps:
    - "system_check"
    - "hn_scraping"
    - "firecrawl_content"
    - "content_processing"
    - "script_generation"
    - "image_generation"
    - "tts_generation"
    - "audio_cleaning"
    - "audio_assembly"
    - "asr_processing"
    - "video_generation"

  # Cache configuration
  cache:
    enabled: true
    directory: "cache"
    expiration_hours: 24

# Output Configuration
output:
  base_directory: "outputs"
  organize_by_story: true
  keep_intermediate_files: true
  audio_format: "wav"
  audio_quality: "high"

# API Configuration
apis:
  firecrawl:
    base_url: "${FIRECRAWL_BASE_URL}"
    api_key: "${FIRECRAWL_API_KEY}"

  openai:
    api_key: "${OPENAI_API_KEY}"

  hn:
    user_agent: "hn.fm/0.1.0 (briancaffey)"

# ASR Service Configuration (WhisperX)
asr:
  base_url: "${ASR_BASE_URL}"
  model_size: "${ASR_MODEL_SIZE}"
  min_speakers: 2
  max_speakers: 2

# Image Generation Service Configuration
image_generation:
  backend: "${IMAGE_GENERATION_BACKEND}"  # "NIM" or "INVOKEAI"
  base_url: "${IMAGE_GENERATION_BASE_URL}"
  default_height: 720
  default_width: 1280
  default_cfg_scale: 1.0
  default_mode: "base"
  default_steps: 50
  default_samples: 1
  output_directory: "images"
  timeout_seconds: 1800  # 30 minutes timeout for image generation
  # InvokeAI specific configuration
  invokeai:
    base_url: "${INVOKEAI_BASE_URL}"
    board_id: "${INVOKEAI_BOARD_ID}"

# Development Configuration
development:
  debug: false
  log_level: "INFO"
  enable_progress_bars: true
  parallel_processing: false
