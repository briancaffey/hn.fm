# Lint and tests, so neither can quietly rot again. Both were broken on main
# when this was added: 31 ESLint errors (one of them a real bug — a stray quote
# in `<span v-else">` meant both branches rendered at once) and 3 stale Python
# tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      # Design-system rules: no hardcoded palette colours (they were the
      # reason dark mode looked wrong), no page container outside the two
      # archetypes, no heading off the scale.
      - run: yarn audit

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The suite uses a throwaway SQLite DB (see the autouse fixtures in
    # src/hnfm/test/conftest.py) and needs no Postgres. It does need Redis:
    # a handful of tests exercise the Celery result backend, and Celery's
    # reconnect loop turns a missing broker into 20 retries of log noise
    # before the real assertion failure.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # Every LLM call in the suite is mocked, but LLMService validates its
      # configuration in the constructor and fails closed when none is set —
      # deliberately, so a missing LLM cannot silently produce placeholder
      # content. CI needs an address that exists, never one it can reach.
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_API_KEY: ci-not-a-real-key
      OPENAI_API_KEY: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest src/hnfm/test -q
