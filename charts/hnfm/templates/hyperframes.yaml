{{- if .Values.hyperframes.enabled }}
{{- $name := printf "%s-hyperframes" (include "hnfm.fullname" .) -}}
# HyperFrames render sidecar: headless Chromium + ffmpeg behind a tiny HTTP
# API. Workers hand it absolute paths under /app/outputs, so it mounts the
# same claim at the same path. Needs internet egress at render time (Google
# Fonts, GSAP CDN, and arbitrary sites for /shot thumbnails).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hyperframes
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hnfm.selectorLabels" (dict "root" . "name" "hyperframes") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hnfm.selectorLabels" (dict "root" . "name" "hyperframes") | nindent 8 }}
    spec:
      {{- include "hnfm.podScheduling" . | nindent 6 }}
      containers:
        - name: hyperframes
          image: {{ include "hnfm.image.hyperframes" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "8088"
            - name: SHOT_CONCURRENCY
              value: {{ .Values.hyperframes.shotConcurrency | quote }}
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.hyperframes.resources | nindent 12 }}
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: {{ include "hnfm.outputsClaim" . }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hyperframes
spec:
  selector:
    {{- include "hnfm.selectorLabels" (dict "root" . "name" "hyperframes") | nindent 4 }}
  ports:
    - name: http
      port: 8088
      targetPort: http
{{- end }}
