{{- $name := printf "%s-frontend" (include "hnfm.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "hnfm.selectorLabels" (dict "root" . "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hnfm.selectorLabels" (dict "root" . "name" "frontend") | nindent 8 }}
    spec:
      {{- include "hnfm.podScheduling" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "hnfm.image.frontend" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NITRO_HOST
              value: "0.0.0.0"
            - name: NITRO_PORT
              value: "3000"
            # Empty = the browser calls the API on the same origin it loaded
            # the page from (the ingress path-routes /api), so the app works
            # on every hostname that reaches the ingress — hnfm.lan and a
            # Tailscale Ingress alike — with no cross-origin calls. SSR
            # can't use a relative URL, so it forwards /api to the web
            # Service directly (frontend server/api/[...].ts).
            - name: NUXT_PUBLIC_API_BASE
              value: ""
            - name: NUXT_API_UPSTREAM
              value: "http://{{ include "hnfm.fullname" . }}-web:8000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "hnfm.selectorLabels" (dict "root" . "name" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
