{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values -}}
{{- $dbUrl := $v.DATABASE_URL -}}
{{- if and (not $dbUrl) .Values.postgres.enabled -}}
{{- $dbUrl = printf "postgresql+psycopg://%s:%s@%s:%s/%s" .Values.postgres.user $v.POSTGRES_PASSWORD (include "hnfm.postgresHost" .) (include "hnfm.postgresPort" .) .Values.postgres.database -}}
{{- end -}}
{{- if not $dbUrl }}
{{- fail "secrets.values.DATABASE_URL is required when postgres.enabled=false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hnfm.secretName" . }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- range $k, $val := $v }}
  {{- if ne $k "DATABASE_URL" }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
