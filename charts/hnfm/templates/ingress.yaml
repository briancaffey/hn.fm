{{- if .Values.ingress.enabled }}
{{- $full := include "hnfm.fullname" . -}}
# One host, path-routed. Traefik picks the longest matching prefix, so the API,
# MinIO and Flower paths win over the frontend catch-all. Sharing the origin is
# what makes CORS and presigned MinIO URLs a non-issue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
  annotations:
    gethomepage.dev/href: {{ include "hnfm.publicUrl" . | quote }}
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=hnfm,app.kubernetes.io/component=web"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          {{- range list "/api" "/docs" "/redoc" "/openapi.json" "/health" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-web
                port:
                  number: 8000
          {{- end }}
          {{- if .Values.minio.enabled }}
          - path: /{{ .Values.minio.bucket }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-minio
                port:
                  number: 9000
          {{- end }}
          {{- if .Values.radio.enabled }}
          # The stream. Icecast serves the mount at this exact path, so no
          # prefix stripping is needed (plans/20).
          - path: /radio/
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-icecast
                port:
                  number: 8000
          {{- end }}
          {{- if .Values.flower.enabled }}
          - path: /flower
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-flower
                port:
                  number: 5555
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  number: 3000
    {{- if and .Values.radio.enabled .Values.radio.publicHost }}
    # The public face of the station: ONLY the listen page and the stream.
    # Nothing else on this host resolves — the dashboard stays on the LAN
    # host above (plans/20).
    - host: {{ .Values.radio.publicHost | quote }}
      http:
        paths:
          - path: /radio/
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-icecast
                port:
                  number: 8000
          - path: /api/radio/status
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-web
                port:
                  number: 8000
          - path: /api/radio/now
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-web
                port:
                  number: 8000
          - path: /api/radio/history
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-web
                port:
                  number: 8000
          # The archive of finished blocks and its podcast feed: read-only.
          - path: /api/radio/archive
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-web
                port:
                  number: 8000
          - path: /listen
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  number: 3000
          - path: /_nuxt
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  number: 3000
    {{- end }}
{{- end }}
