{{- if .Values.externalSecret.enabled }}
{{- if .Values.secrets.create }}
{{- fail "set secrets.create=false when externalSecret.enabled=true (both would own the same Secret)" }}
{{- end }}
# External Secrets Operator materialises <release>-secrets from one Vaultwarden
# item (home-lab convention: item name <namespace>-<secretname>, one custom
# field per key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hnfm.secretName" . }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
  annotations:
    # Config and credentials exist before anything that reads them (datastores
    # are wave -2, the migrate hook -1, the app 0).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind }}
  target:
    name: {{ include "hnfm.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
