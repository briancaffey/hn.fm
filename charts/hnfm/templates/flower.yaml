{{- if .Values.flower.enabled }}
{{- $name := printf "%s-flower" (include "hnfm.fullname" .) -}}
# Celery monitoring at <host>/flower. Flower has no auth of its own; it is
# only reachable on the LAN through the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hnfm.selectorLabels" (dict "root" . "name" "flower") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hnfm.selectorLabels" (dict "root" . "name" "flower") | nindent 8 }}
    spec:
      {{- include "hnfm.podScheduling" . | nindent 6 }}
      containers:
        - name: flower
          image: {{ .Values.flower.image }}
          env:
            - name: CELERY_BROKER_URL
              value: {{ printf "redis://%s:%s/%s" (include "hnfm.redisHost" .) (include "hnfm.redisPort" .) .Values.redis.db | quote }}
            - name: CELERY_RESULT_BACKEND
              value: {{ printf "redis://%s:%s/%s" (include "hnfm.redisHost" .) (include "hnfm.redisPort" .) .Values.redis.db | quote }}
            - name: FLOWER_PORT
              value: "5555"
            - name: FLOWER_URL_PREFIX
              value: flower
          ports:
            - name: http
              containerPort: 5555
          readinessProbe:
            httpGet: { path: /flower/healthcheck, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  selector:
    {{- include "hnfm.selectorLabels" (dict "root" . "name" "flower") | nindent 4 }}
  ports:
    - name: http
      port: 5555
      targetPort: http
{{- end }}
