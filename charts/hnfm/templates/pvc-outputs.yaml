# Pipeline scratch + everything the API still serves from local disk
# (thumbnails, digests, RSS enclosure sizes). Shared by web, all workers,
# beat and the render sidecar at the identical path /app/outputs. MinIO holds
# the durable copies of media; this is the working tree.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hnfm.outputsClaim" . }}
  labels:
    {{- include "hnfm.labels" . | nindent 4 }}
  annotations:
    # Same wave as the migrate Job, which is this claim's first consumer.
    # local-path binds on first use (WaitForFirstConsumer), and Argo treats a
    # Pending claim as not-yet-healthy, so a claim in an earlier wave than any
    # pod that mounts it stalls the sync forever.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.outputs }}
